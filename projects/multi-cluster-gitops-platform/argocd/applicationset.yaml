# Generic ArgoCD ApplicationSet — replace repoURL and cluster names with your own.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps
spec:
  generators:
    - list:
        elements:
          - cluster: cluster-a
            url: https://kubernetes.default.svc
          - cluster: cluster-b
            url: https://kubernetes.default.svc
  template:
    metadata:
      name: '{{cluster}}-sample-app'
    spec:
      project: default
      source:
        repoURL: https://github.com/<your-org>/<your-repo>.git
        targetRevision: main
        path: environments/prod
      destination:
        server: '{{url}}'
        namespace: sample-app
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
